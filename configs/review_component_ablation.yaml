base: env_default.yaml
experiment_id: review_component_ablation
data:
  source: uci_hydraulic
  root: data/uci_hydraulic
  calib_frac: 0.5
  split_seed: 12345
  stable_only: false
llm:
  backend: openai_compat
  base_url: http://localhost:8000/v1
  model: Qwen/Qwen2.5-7B-Instruct-AWQ
  api_key_env: null
  cache_path: runs/phase3_b2_uci/llm_cache.sqlite
  gen: {temperature: 0.0, max_tokens: 256, seed: 0}
methods: [B4_rifl_iot]
conditions:
  noise30_range_only:    {feedback.noise.eta: 0.3, reliability.components: [range]}
  noise30_stuck_only:       {feedback.noise.eta: 0.3, reliability.components: [stuck]}
  noise30_agree_only:          {feedback.noise.eta: 0.3, reliability.components: [agree]}
  noise50_range_only:             {feedback.noise.eta: 0.5, reliability.components: [range]}
  noise50_stuck_only:                {feedback.noise.eta: 0.5, reliability.components: [stuck]}
  noise50_agree_only:                   {feedback.noise.eta: 0.5, reliability.components: [agree]}
seeds: [0, 1, 2, 3, 4]
output_root: runs
results_root: results
