# Phase 1 on real UCI hydraulic data with a local OpenAI-compatible server (e.g. vLLM).
base: env_default.yaml
experiment_id: phase1_vanilla_uci
data:
  source: uci_hydraulic
  root: data/uci_hydraulic
  calib_frac: 0.5
  split_seed: 12345
  stable_only: false
llm:
  backend: openai_compat
  base_url: http://localhost:8000/v1
  model: Qwen/Qwen2.5-7B-Instruct-AWQ      # set to the model you serve
  api_key_env: null
  cache_path: runs/phase1_vanilla_uci/llm_cache.sqlite
  gen: {temperature: 0.0, max_tokens: 256, seed: 0}
methods: [B0_vanilla]
conditions:
  clean: {}
  drift: {run.schedule: drift}
seeds: [0, 1, 2, 3, 4]
output_root: runs
results_root: results
