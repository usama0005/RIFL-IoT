base: env_default.yaml
experiment_id: diag_alpha_sensitivity
data:
  source: uci_hydraulic
  root: data/uci_hydraulic
  calib_frac: 0.5
  split_seed: 12345
  stable_only: false
llm:
  backend: openai_compat
  base_url: http://localhost:8000/v1
  model: Qwen/Qwen2.5-7B-Instruct-AWQ
  api_key_env: null
  cache_path: runs/phase3_b2_uci/llm_cache.sqlite
  gen: {temperature: 0.0, max_tokens: 256, seed: 0}
methods: [B2_naive]
conditions:
  alpha010: {la.alpha: 0.1}
  alpha004: {la.alpha: 0.04}
seeds: [2, 3]
output_root: runs
results_root: results
